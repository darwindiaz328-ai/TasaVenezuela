name: Monitor de Tasas Automatizado

on:
  schedule:
    # 1. Ventana de Medianoche reforzada (Venezuela VET UTC-4 = 04:00-05:00 UTC):
    # Triggers redundantes escalonados (04:03, 04:12, 04:25, 04:45 UTC = 12:03 AM, 12:12 AM, 12:25 AM, 12:45 AM VET)
    # Blindaje contra alta congestión de cola en GitHub Actions para garantizar actualización puntual diaria.
    - cron: '3,12,25,45 4 * * *'
    # 2. Monitoreo regular durante el día cada 3 horas (03:17 AM, 06:17 AM, 09:17 AM, 12:17 PM, 03:17 PM, 06:17 PM, 09:17 PM VET)
    - cron: '17 1,7,10,13,16,19,22 * * *'
  workflow_dispatch: # Permite disparo manual desde la interfaz de Actions o API
    inputs:
      force:
        description: 'Forzar actualización completa'
        required: false
        type: boolean
        default: true
  repository_dispatch: # Permite disparo externo mediante Webhook HTTP POST
    types: [webhook_update, medianoche_trigger, external_ping]

# Principio de mínimo privilegio: bloquear permisos globales por defecto
permissions: {}

# Evita colisiones de git push entre ejecuciones concurrentes
concurrency:
  group: rates-updater-pipeline
  cancel-in-progress: false

jobs:
  ejecutar_robot:
    name: Extraer Tasas y Actualizar
    runs-on: ubuntu-latest
    permissions:
      contents: write # Solo este job tiene permiso para escribir commits en el repositorio
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # Descarga rápida (shallow clone)

      - name: Inicializar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # Versión fija preinstalada en el runner (arranque instantáneo)

      - name: Ejecutar Extractor de Tasas
        env:
          FORCE_UPDATE: ${{ github.event.inputs.force || (github.event_name == 'repository_dispatch') }}
        run: python update_rates.py

      - name: Validar Continuidad e Integridad de Tasas
        run: python validate_history.py

      - name: Publicar cambios (solo si hubo variación real de tasas o fecha)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(rates): actualización automática de tasas e historial"
          file_pattern: 'historial.json Datos/rates.json'
          skip_dirty_check: false
          skip_fetch: true
