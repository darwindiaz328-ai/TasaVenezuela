name: Monitor de Tasas Automatizado

on:
  schedule:
    # Se ejecuta a las 12:01 AM (hora Venezuela UTC-4 = 04:01 UTC) y luego cada 3 horas:
    # VET: 12:01 AM, 03:01 AM, 06:01 AM, 09:01 AM, 12:01 PM, 03:01 PM, 06:01 PM, 09:01 PM
    # UTC: 04:01,    07:01,    10:01,    13:01,    16:01,    19:01,    22:01,    01:01
    - cron: '1 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch: # Activa el botón manual en la pestaña Actions

permissions:
  contents: write

jobs:
  executar_robot:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Inicializar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ejecutar Extractor de Precios
        run: python update_rates.py

      - name: Publicar cambios en el repositorio de forma segura
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Servidor actualizó tasas e historial automáticamente"
          file_pattern: 'historial.json Datos/*'
